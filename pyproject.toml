[project]
name = "appcli"
version = "0.1.0"
description = "Visor de archivos IFC con consola de IA local (Ollama)"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "ollama",
]

[project.scripts]
appcli = "appcli.main:main"

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
