[project]
name = "appcli"
version = "0.1.0"
description = "Visor de archivos IFC con consola de IA local (Ollama)"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "ollama",
    "ttkthemes",
]

[project.gui-scripts]
appcli = "appcli.main:main"

[project.scripts]
appcli-install = "appcli.installer:main"

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appcli = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
