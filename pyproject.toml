[project]
name = "dataviewerifc"
version = "1.2.0"
description = "Visor de archivos IFC con consola de IA"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "ollama",
    "ttkthemes",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
]

[project.gui-scripts]
dataviewerifc = "dataviewerifc.main:main"

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataviewerifc = ["data/manual_usuario.md", "data/Modelfile", "data/system_prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
